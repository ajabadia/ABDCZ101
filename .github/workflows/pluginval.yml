name: Pluginval CI

# pluginval (Tracktion), strictness 5, seed 42, binario PINNEADO a v1.0.4 — las
# mismas constantes que usa ABDEep y ABDBankManager, para que "verde" signifique
# lo mismo en los tres repos de la suite.
#
# POR QUE EXISTE: hasta hoy la validacion del VST3 de este repo era "abre el
# DAW en la maquina del autor". pluginval es la puerta que cierra esa puerta:
# carga y descarga el plugin decenas de veces, cambia sample rates, mueve buses,
# y todo eso sin DAW ni UI.
#
# EL LAYOUT DE LOS DOS CHECKOUTS es el mismo que el de ci.yml, y por el mismo
# motivo: este repo no compila sin su hermano ABDSharedCode al lado (PhaseDistOsc.h
# llega a ../../../../ABDSharedCode/LutDSP/...). El hermano va fijado al MISMO
# SHA que ci.yml para que las dos puertas no midan dos arboles distintos.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - ".github/workflows/pluginval.yml"
  push:
    branches: [ main ]
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - ".github/workflows/pluginval.yml"

permissions:
  contents: read

concurrency:
  group: cz101-pluginval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pluginval:
    name: Pluginval — VST3 strictness 5 (seed 42)
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ABDCZ101

    steps:
    - uses: actions/checkout@v7
      with:
        path: ABDCZ101

    - uses: actions/checkout@v7
      with:
        repository: ajabadia/ABDSharedCode
        ref: 3d4006a0db07771d6d39ee225f073a0ce8d3b4a1
        path: ABDSharedCode
        fetch-depth: 1

    # El SDK de WebView2: juce_add_plugin declara NEEDS_WEBVIEW2 TRUE y
    # FindWebView2.cmake lo busca en la carpeta NuGet local, que el runner no
    # trae. Mismo procedimiento (y misma version) que el de ci.yml.
    - name: Install WebView2 SDK
      shell: pwsh
      run: |
        $version = "1.0.4258.31"
        $root = Join-Path $env:RUNNER_TEMP "webview2"
        $pkg = Join-Path $root "Microsoft.Web.WebView2"
        New-Item -ItemType Directory -Force -Path $pkg | Out-Null
        $zip = Join-Path $env:RUNNER_TEMP "webview2.zip"
        $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $pkg -Force
        foreach ($f in @(
          (Join-Path $pkg "build/native/include/WebView2.h"),
          (Join-Path $pkg "build/native/x64/WebView2LoaderStatic.lib"))) {
          if (-not (Test-Path $f)) {
            Write-Error "Falta $f en el paquete de WebView2: la descarga ha fallado"
            exit 1
          }
        }
        "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ env.WEBVIEW2_ROOT }}"

    - name: Build VST3 target (CZ101Emulator_VST3)
      run: cmake --build build --config Release --target CZ101Emulator_VST3

    - name: Download pluginval v1.0.4 (pinned)
      shell: pwsh
      run: |
        $pvZip = "$env:RUNNER_TEMP\pluginval_Windows.zip"
        Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $pvZip
        Expand-Archive -Path $pvZip -DestinationPath "$env:RUNNER_TEMP\pluginval" -Force

    - name: Run pluginval validation (strictness 5, seed 42)
      shell: pwsh
      run: |
        $vst3 = Get-ChildItem "build\*_artefacts\Release\VST3\*.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $vst3) {
          Write-Host "::error::pluginval — no se encontro VST3 en build/*_artefacts/Release/VST3/"
          exit 1
        }
        $pv = Get-ChildItem "$env:RUNNER_TEMP\pluginval" -Recurse -Filter "pluginval.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $pv) {
          Write-Host "::error::pluginval — no se encontro pluginval.exe"
          exit 1
        }
        Write-Host "Validando: $($vst3.FullName)"
        & $pv.FullName --strictness-level 5 --seed 42 --validate $vst3.FullName *> pluginval.log
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::pluginval — validacion fallida (strictness 5, seed 42). Ver pluginval.log"
          Get-Content pluginval.log
          exit $LASTEXITCODE
        }
        Write-Host "pluginval: ALL TESTS PASSED (strictness 5, seed 42)"
        Get-Content pluginval.log | Select-String -Pattern "ALL TESTS PASSED|PASSED" | Select-Object -First 3

    - name: Publish pluginval log (on failure diagnostics)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: pluginval-log-${{ github.run_id }}
        path: ABDCZ101/pluginval.log
        if-no-files-found: ignore
        retention-days: 30
