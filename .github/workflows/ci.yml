name: CZ-101 Emulator CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Build & Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cmake_gen: "Unix Makefiles"
          - os: windows-latest
            cmake_gen: "Visual Studio 17 2022"

    # ESTE REPO NO SE COMPILE SOLO. Su CMakeLists.txt mete `../ABDSharedCode`
    # en los includes de tres targets, y PhaseDistOsc.h llega hasta el hermano
    # con una ruta relativa fija, "../../../../ABDSharedCode/LutDSP/...", que
    # desde Source/DSP/Oscillators/ sale justo un nivel por encima del repo.
    #
    # En la maquina de desarrollo el hermano ya esta ahi, al lado, y no falta
    # nada. En el runner no hay nadie al lado, y el job se caia al compilar,
    # muy despues de configurar y de que el build ya hubiera empezado:
    #
    #   PhaseDistOsc.h:4:10: fatal error:
    #     ../../../../ABDSharedCode/LutDSP/LutEvaluatorSimd.h: No such file or directory
    #
    # Por eso los dos checkouts van a SUBCARPETAS y no a la raiz del workspace:
    # el layout tiene que ser el del monorepo, con ABDCZ101 y ABDSharedCode al
    # mismo nivel. Es el mismo motivo, y el mismo reparto, que usa el job de
    # contratos de ABDSharedAssets para sus cuatro hermanos.
    #
    # El hermano va FIJADO a un SHA y no a una rama. Con `main`, un PR pasaria
    # en verde contra el codigo de hoy y en rojo contra el de dentro de dos
    # dias, sin que nadie haya tocado nada aqui.
    defaults:
      run:
        working-directory: ABDCZ101

    steps:
    - uses: actions/checkout@v7
      with:
        path: ABDCZ101

    - uses: actions/checkout@v7
      with:
        repository: ajabadia/ABDSharedCode
        ref: 3d4006a0db07771d6d39ee225f073a0ce8d3b4a1
        path: ABDSharedCode
        fetch-depth: 1
    
    # 1. Setup Dependencies
    #
    # `libwebkit2gtk-4.1-dev`, y no `4.0-dev`: el 4.0 se elimino de Ubuntu hace
    # versiones y `ubuntu-latest` ya no lo trae, asi que el `apt-get install`
    # fallaba con "Unable to locate package" y se caia el job entero ANTES de
    # llegar a compilar. El rojo no era de este repositorio: estaba asi desde
    # antes de que hubiera aqui ninguna puerta que lo mirase.
    #
    # El 4.1 es el que corresponde a WebKitGTK 2.42 en adelante, que es lo que
    # JUCE linka. ABDBankManager, en esta misma suite, ya pedia el 4.1 y su
    # build pasa, asi que el cambio no es una suposicion.
    #
    # `libgtk-3-dev` va explicito, y no porque se pogiera en el mismo sitio que
    # el 4.1. Durante anos llego de rebote: lo arrastraba
    # `libwebkit2gtk-4.1-dev` como dependencia. En el runner de hoy ya no lo
    # arrastra, y sin el el build moria mucho mas abajo, al compilar de verdad:
    #
    #   juce_gui_extra.cpp:127:11: fatal error: gtk/gtk.h: No such file or directory
    #
    # que es el mismogenre de fallo que el 4.0-dev de antes: un paquete que
    # el runner ya no trae, y que aqui se daba por instalado sin estar en la
    # lista. Ponerlo a mano es lo que evita depender de que algo lo arrastre.
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev  \
          libfreetype6-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxcursor1 libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libglu1-mesa-dev mesa-common-dev

    # 2. Configure CMake
    - name: Configure CMake
      run: cmake -S . -B build -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release

    # 3. Build Plugin & Tests
    - name: Build
      run: cmake --build build --config Release

    # 4. Run Unit Tests (SysEx + Snapshot DSP)
    - name: Run Unit Tests
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./build/Release/CZ101SysExTest.exe
          ./build/Release/CZ101SysExRoundTripTest.exe
          ./build/Release/CZ101SnapshotDSPTest.exe
        else
          ./build/CZ101SysExTest
          ./build/CZ101SysExRoundTripTest
          ./build/CZ101SnapshotDSPTest
        fi

    # 5. Run Offline Golden Master Verification
    # (Requires Standalone to be built)
    - name: Generate Golden Master
      shell: bash
      run: |
        echo "Running Offline Render..."
        # Locate Standalone executable
        if [ "$RUNNER_OS" == "Windows" ]; then
          EXE_PATH="./build/Release/CZ101Emulator.exe" # Actually Standalone is usually named CZ101Emulator_Standalone? Or just product name.
          # Config says PRODUCT_NAME "CZ-101 Emulator" -> "CZ-101 Emulator.exe"?
          # JUCE Default: Standalone target name is usually ProjectName_Standalone?
          # Actually CMake target is `CZ101Emulator_Standalone` usually.
          # Let's check listing if possible, but assuming standard JUCE CMake behavior:
          # If 'copy_plugin_after_build' is off.
          # Try to run it.
          # Note: We might not have the golden master verification fully automated yet without the WAV comparison tool,
          # but we can ensuring it RUNS without crashing.
          # $EXE_PATH --render-gold
        else
          # Linux
          # ./build/CZ101Emulator_Standalone --render-gold
          echo "Skipping Render on Linux for now (headless setup varies)"
        fi
        
    # 6. Upload Artifacts (Optional)
    # - uses: actions/upload-artifact@v7
    #   with:
    #     name: golden-master-${{ matrix.os }}
    #     path: golden_master.wav
