name: CZ-101 Emulator CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# HIGIENE DE FAMILIA (la llevan ABDEep, ABDBankManager y ABDMS2000): permisos
# minimos, un solo run por ref y un tope de tiempo por job. Sin concurrency, dos
# pushes seguidos encolan dos matrices enteras para un resultado que ya no
# importa; sin timeout, un hang de CMake se come los 6 horas del runner.
permissions:
  contents: read

concurrency:
  group: cz101-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build & Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Tope de familia. NO hay medicion propia atras de este numero: es el mismo
    # orden de magnitud que el de ABDEep (30 min para build+tests, 45 para
    # pluginval) con margen para el runner, que es mas lento que una maquina
    # local. Si este job llega a cortarse por tiempo, subirlo con la medicion
    # del log a mano, no a ojo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cmake_gen: "Unix Makefiles"
          - os: windows-latest
            cmake_gen: "Visual Studio 17 2022"

    # ESTE REPO NO SE COMPILE SOLO. Su CMakeLists.txt mete `../ABDSharedCode`
    # en los includes de tres targets, y PhaseDistOsc.h llega hasta el hermano
    # con una ruta relativa fija, "../../../../ABDSharedCode/LutDSP/...", que
    # desde Source/DSP/Oscillators/ sale justo un nivel por encima del repo.
    #
    # En la maquina de desarrollo el hermano ya esta ahi, al lado, y no falta
    # nada. En el runner no hay nadie al lado, y el job se caia al compilar,
    # muy despues de configurar y de que el build ya hubiera empezado:
    #
    #   PhaseDistOsc.h:4:10: fatal error:
    #     ../../../../ABDSharedCode/LutDSP/LutEvaluatorSimd.h: No such file or directory
    #
    # Por eso los dos checkouts van a SUBCARPETAS y no a la raiz del workspace:
    # el layout tiene que ser el del monorepo, con ABDCZ101 y ABDSharedCode al
    # mismo nivel. Es el mismo motivo, y el mismo reparto, que usa el job de
    # contratos de ABDSharedAssets para sus cuatro hermanos.
    #
    # El hermano va FIJADO a un SHA y no a una rama. Con `main`, un PR pasaria
    # en verde contra el codigo de hoy y en rojo contra el de dentro de dos
    # dias, sin que nadie haya tocado nada aqui.
    defaults:
      run:
        working-directory: ABDCZ101

    steps:
    - uses: actions/checkout@v7
      with:
        path: ABDCZ101

    - uses: actions/checkout@v7
      with:
        repository: ajabadia/ABDSharedCode
        ref: 3d4006a0db07771d6d39ee225f073a0ce8d3b4a1
        path: ABDSharedCode
        fetch-depth: 1
    
    # 1. Setup Dependencies
    #
    # `libwebkit2gtk-4.1-dev`, y no `4.0-dev`: el 4.0 se elimino de Ubuntu hace
    # versiones y `ubuntu-latest` ya no lo trae, asi que el `apt-get install`
    # fallaba con "Unable to locate package" y se caia el job entero ANTES de
    # llegar a compilar. El rojo no era de este repositorio: estaba asi desde
    # antes de que hubiera aqui ninguna puerta que lo mirase.
    #
    # El 4.1 es el que corresponde a WebKitGTK 2.42 en adelante, que es lo que
    # JUCE linka. ABDBankManager, en esta misma suite, ya pedia el 4.1 y su
    # build pasa, asi que el cambio no es una suposicion.
    #
    # `libgtk-3-dev` va explicito, y no porque se pogiera en el mismo sitio que
    # el 4.1. Durante anos llego de rebote: lo arrastraba
    # `libwebkit2gtk-4.1-dev` como dependencia. En el runner de hoy ya no lo
    # arrastra, y sin el el build moria mucho mas abajo, al compilar de verdad:
    #
    #   juce_gui_extra.cpp:127:11: fatal error: gtk/gtk.h: No such file or directory
    #
    # que es el mismogenre de fallo que el 4.0-dev de antes: un paquete que
    # el runner ya no trae, y que aqui se daba por instalado sin estar en la
    # lista. Ponerlo a mano es lo que evita depender de que algo lo arrastre.
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev  \
          libfreetype6-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxcursor1 libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libglu1-mesa-dev mesa-common-dev

    # juce_add_plugin pide NEEDS_WEBVIEW2 TRUE, y el SDK de WebView2 no viene
    # con el runner: FindWebView2.cmake de JUCE lo busca en la carpeta local de
    # NuGet, no lo encuentra y aborta el configure con
    #   Could NOT find WebView2 (missing: WebView2_include_dir WebView2_library)
    #
    # El script deja dos caminos: instalar el paquete NuGet en la carpeta del
    # usuario, o descargarlo y pasarle JUCE_WEBVIEW2_PACKAGE_LOCATION apuntando
    # al directorio que lo contiene. Se usa el segundo porque no depende de que
    # el runner traiga el proveedor NuGet de PackageManagement.
    - name: Install WebView2 SDK
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # FindWebView2.cmake hace glob de "<location>/*Microsoft.Web.WebView2*"
        # y de ahi saca build/native/include/WebView2.h y
        # build/native/x64/WebView2LoaderStatic.lib. El paquete NuGet trae
        # justo ese arbol, asi que se descarga y se extrae con ese nombre.
        # Ojo: el enlace go.microsoft.com/fwlink/p/?LinkId=2124703 ya no da el
        # SDK, redirige a MicrosoftEdgeWebview2Setup.exe, que no es un zip.
        $version = "1.0.4258.31"
        $root = Join-Path $env:RUNNER_TEMP "webview2"
        $pkg = Join-Path $root "Microsoft.Web.WebView2"
        New-Item -ItemType Directory -Force -Path $pkg | Out-Null
        $zip = Join-Path $env:RUNNER_TEMP "webview2.zip"
        $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $pkg -Force
        $esperados = @(
          (Join-Path $pkg "build/native/include/WebView2.h"),
          (Join-Path $pkg "build/native/x64/WebView2LoaderStatic.lib")
        )
        foreach ($f in $esperados) {
          if (-not (Test-Path $f)) {
            Write-Error "Falta $f en el paquete de WebView2: la descarga ha fallado"
            exit 1
          }
        }
        Write-Host "Raiz del SDK: $root"
        "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # 2. Configure CMake
    - name: Configure CMake
      run: cmake -S . -B build -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ env.WEBVIEW2_ROOT }}"

    # 3. Build Plugin & Tests
    - name: Build
      run: cmake --build build --config Release

    # 4. Run Unit Tests (SysEx + Snapshot DSP)
    - name: Run Unit Tests
      shell: bash
      run: |
        # CZ101SysExTest no se vale solo: su main() devuelve 1 y se limita a
        # imprimir "Usage: CZ101SysExTest <path_to_syx_file>" si no le pasan un
        # fichero. Le damos uno de verdad del repo.
        #
        # Las rutas no son las mismas por dos motivos. Con MSVC el generador es
        # multi-config, asi que todo lleva build/Release/ delante. Y ademas
        # CZ101SnapshotDSPTest lo crea juce_add_console_app, que le pone
        # RUNTIME_OUTPUT_DIRECTORY y lo manda a su propia carpeta de artefactos;
        # solo los dos add_executable a mano se quedan en la raiz de build.
        if [ "$RUNNER_OS" == "Windows" ]; then
          SYSEX="./build/Release/CZ101SysExTest.exe"
          ROUNDTRIP="./build/Release/CZ101SysExRoundTripTest.exe"
          SNAPSHOT="./build/CZ101SnapshotDSPTest_artefacts/Release/CZ101SnapshotDSPTest.exe"
        else
          SYSEX="./build/CZ101SysExTest"
          ROUNDTRIP="./build/CZ101SysExRoundTripTest"
          SNAPSHOT="./build/CZ101SnapshotDSPTest_artefacts/Release/CZ101SnapshotDSPTest"
        fi

        "$SYSEX" ./DOCS/info/patches/cz-pack-1/Afterxylo.syx
        "$ROUNDTRIP"
        "$SNAPSHOT"

    # BLOQUEANTE CON BASELINE desde el 2026-10-12. La deuda se midio ese
    # mismo dia en local con cppcheck 2.21 sobre Source/ con ESTE comando
    # (22 hallazgos, 10 de ellos en Source/Utils/httplib.h, codigo de terceros)
    # y su firma quedo guardada en .github/cppcheck-baseline.txt: severidad|
    # archivo|mensaje, SIN numero de linea (se mueve al reformatear). Solo
    # bloquean hallazgos FUERA de la baseline, la ausencia de la propia
    # baseline, y que la comprobacion no llegue a medirse. OJO con el `2>&1`:
    # cppcheck escribe los hallazgos en stderr, y medir sin el siempre cuenta 0.
    - name: Static analysis (cppcheck) - bloqueante (baseline)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
        cppcheck --version
        baseline=.github/cppcheck-baseline.txt
        if [ ! -f "$baseline" ]; then
          echo "::error title=cppcheck::no existe $baseline: sin baseline no se puede separar deuda de regresion."
          exit 1
        fi
        set +e
        salida=$(cppcheck --enable=warning,performance,portability --std=c++20 --suppress=missingIncludeSystem --template='{severity}|{file}|{line}|{message}' Source/ 2>&1)
        codigo=$?
        set -e
        if [ -z "$salida" ]; then
          echo "::error title=cppcheck::cppcheck no ha producido ni una linea (codigo $codigo): la comprobacion no llego a medirse."
          exit 1
        fi
        tmp=$(mktemp)
        printf '%s\n' "$salida" > "$tmp"
        actuales=$(python3 - "$tmp" <<'PY'
        import re, sys
        out = set()
        pat = re.compile(r"^(warning|performance|portability|error)\|([^|]+)\|[^|]+\|(.*)$")
        for ln in open(sys.argv[1], encoding="utf-8", errors="replace"):
            m = pat.match(ln.rstrip("\n"))
            if m:
                out.add(m.group(1) + "|" + m.group(2).replace("\\", "/") + "|" + m.group(3))
        print("\n".join(sorted(out)))
        PY
        )
        rm -f "$tmp"
        nuevos=$(printf '%s\n' "$actuales" | grep -vxF -f "$baseline" || true)
        if [ -n "$nuevos" ]; then
          printf '%s\n' "$nuevos" | sed -n '1,30p'
          n=$(printf '%s\n' "$nuevos" | grep -c . || true)
          echo "::error title=cppcheck::${n} hallazgos NUEVOS fuera de la baseline: regresion. Arreglo: atacarlos; solo si es deuda aceptada deliberadamente, anadir su firma a $baseline en el MISMO PR."
          exit 1
        fi
        af=$(mktemp)
        printf '%s\n' "$actuales" > "$af"
        obsoletas=$(grep -v '^#' "$baseline" | grep -vxF -f "$af" | grep -c . || true)
        rm -f "$af"
        if [ "$obsoletas" -gt 0 ]; then
          echo "::notice title=cppcheck::${obsoletas} firmas de la baseline ya no aparecen: deuda pagada — prune $baseline."
        fi
        echo "::notice title=cppcheck::sin hallazgos nuevos ($(grep -cv '^#' "$baseline") firmas baseladas, ${obsoletas} obsoletas)."
        exit 0
    # 5. Run Offline Golden Master Verification
    # (Requires Standalone to be built)
    - name: Generate Golden Master
      shell: bash
      run: |
        echo "Running Offline Render..."
        # Locate Standalone executable
        if [ "$RUNNER_OS" == "Windows" ]; then
          EXE_PATH="./build/Release/CZ101Emulator.exe" # Actually Standalone is usually named CZ101Emulator_Standalone? Or just product name.
          # Config says PRODUCT_NAME "CZ-101 Emulator" -> "CZ-101 Emulator.exe"?
          # JUCE Default: Standalone target name is usually ProjectName_Standalone?
          # Actually CMake target is `CZ101Emulator_Standalone` usually.
          # Let's check listing if possible, but assuming standard JUCE CMake behavior:
          # If 'copy_plugin_after_build' is off.
          # Try to run it.
          # Note: We might not have the golden master verification fully automated yet without the WAV comparison tool,
          # but we can ensuring it RUNS without crashing.
          # $EXE_PATH --render-gold
        else
          # Linux
          # ./build/CZ101Emulator_Standalone --render-gold
          echo "Skipping Render on Linux for now (headless setup varies)"
        fi
        
    # 6. Upload Artifacts (Optional)
    # - uses: actions/upload-artifact@v7
    #   with:
    #     name: golden-master-${{ matrix.os }}
    #     path: golden_master.wav

  # ----------------------------------------------------------------------------
  # WEBUI (vitest) — BLOQUEANTE. Este repo tenia los tests de la WebUI (389, en
  # 48 ficheros, con vitest.config.js apuntando a WebUI/tests/**) sin ninguna
  # puerta que los ejecutase: pasaban solo quien los corría a mano. MEDIDO en
  # local: 48/48 ficheros, 389/389 tests, exit 0, ~10 s. Por eso bloquea desde
  # el primer dia y no hace falta ninguna deuda aqui.
  #
  # NO `npm install`, y la razon es medible: el package.json declara dos
  # dependencias `workspace:*` (@abdsynths/midi-keyb, @abdsynths/shared) sin
  # ningun workspace raiz que las resuelva, y npm las rechaza en seco —
  # `npm error Unsupported URL Type "workspace:": workspace:*` — tanto con
  # `npm ci` como con `npm install`, en un directorio limpio. Un job que
  # instalase asi naceria rojo por un motivo que no es un rojo del codigo.
  #
  # Lo que los tests necesitan de verdad: vitest (el config hace
  # `import { defineConfig } from 'vitest/config'`, asi que el paquete tiene
  # que ser resoluble desde la raiz) y @abdsynths/shared, que en la maquina
  # de desarrollo es un symlink al hermano ABDSharedAssets y aqui se recrea
  # igual, con el hermano fijado a un SHA y no a una rama. El vitest se
  # instala en un prefijo scratch (con vite dentro de su propio arbol) y se
  # enlaza en node_modules — la mecanica misma esta MEDIDA en un arbol limpio
  # sin node_modules preexistente: 389/389 con vitest 4.1.11.
  # ----------------------------------------------------------------------------
  webui-tests:
    name: WebUI unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ABDCZ101
    steps:
    - uses: actions/checkout@v7
      with:
        path: ABDCZ101

    # computeFit/mountFitStage se importan de '@abdsynths/shared/components',
    # que vive en el hermano ABDSharedAssets. SHA fijo (main remoto), como
    # en el resto de la suite: con una rama, un PR pasaria verde contra el
    # codigo de hoy y rojo contra el de manana.
    - uses: actions/checkout@v7
      with:
        repository: ajabadia/ABDSharedAssets
        ref: 2ae9795797b9b1f2026638aff1df3889be6a24df
        path: ABDSharedAssets
        fetch-depth: 1

    - uses: actions/setup-node@v7
      with:
        node-version: 20

    - name: Bootstrap vitest (scratch prefix + symlink @abdsynths/shared)
      run: |
        npm install --prefix .ci --no-audit --no-fund vitest@4.1.11
        mkdir -p node_modules/@abdsynths
        ln -s ../.ci/node_modules/vitest node_modules/vitest
        ln -s "$GITHUB_WORKSPACE/ABDSharedAssets" node_modules/@abdsynths/shared

    - name: Run vitest
      run: .ci/node_modules/.bin/vitest run

  # ---------------------------------------------------------------------------
  # FORMATO (clang-format) — INFORMATIVO, no bloqueante.
  #
  # No compila nada: lee .clang-format y comprueba que todos los .h/.cpp
  # trackeados obedecen el estilo. Lo hace ejecutando EL HOOK del repo en
  # modo VERIFY_ONLY (VERIFY_ONLY=1 bash .githooks/pre-commit), que usa
  # --dry-run --Werror sobre `git ls-files` y no toca disco. Asi esta puerta
  # valida DOS cosas: que el estilo cuadra, y que EL HOOK funciona — el mismo
  # reparto que usa ABDSharedCode en shared-code-ci.yml.
  #
  # INFORMATIVO, Y LA CUENTA VA ESCRITA AQUI porque es la razon de que no
  # bloquee: MEDIDO en local con clang-format 18.1.8 sobre los .h/.cpp
  # trackeados: 59991 avisos de estilo en 134 ficheros. Con esa
  # deuda un paso bloqueante dejaria el CI rojo permanente por un motivo que
  # no es un rojo nuevo — el mismo calculo con el que el cppcheck de la
  # familia quedo informativo. Cuando se pague la deuda (PR de reformato),
  # se quita el `exit 0` del final y pasa a bloquear.
  #
  # Y DOS COSAS SI BLOQUEAN, porque no son deuda: que la comprobacion no
  # llegue a medir (clang-format ausente, o un VERIFY_ONLY que falla sin
  # reportar ni un aviso), y el test NEGATIVO de abajo, que exige que el
  # hook NOMBRE el fichero mal formateado en su salida.
  clang-format:
    name: Clang-format (estilo C++, informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # El `command -v` es una puerta, no un eco: sin clang-format en el PATH
      # el hook NO falla (imprime un aviso y sale con 0), y el paso de abajo
      # reportaria "sin deuda" sin haber mirado nada. Un verde que no ha medido
      # es el peor de todos.
      - name: Install clang-format 18+
        run: |
          pip install clang-format==18.*
          command -v clang-format
          clang-format --version

      - name: Check formatting (clang-format via hook) - informativo, no bloqueante
        shell: bash
        run: |
          set +e
          VERIFY_ONLY=1 bash .githooks/pre-commit > "$RUNNER_TEMP/fmt.log" 2>&1
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            echo "::notice title=clang-format::sin deuda de formato en los .h/.cpp trackeados."
            exit 0
          fi
          avisos=$(grep -c 'code should be clang-formatted' "$RUNNER_TEMP/fmt.log" || true)
          # Un VERIFY_ONLY que sale con != 0 SIN ningun aviso de formato no es
          # deuda: es que la comprobacion no llego a hacerse (config rota,
          # hook roto,clang-format de otra version). Eso SI bloquea.
          if [ "$avisos" -eq 0 ]; then
            echo "::error title=clang-format::el hook VERIFY_ONLY fallo (codigo $codigo) sin reportar ni un aviso de formato. No es deuda historica: es un fallo de la comprobacion. Log completo abajo."
            cat "$RUNNER_TEMP/fmt.log"
            exit 1
          fi
          echo "::warning title=clang-format::${avisos} avisos de formato en 134 ficheros (deuda historica medida en local: gate informativo hasta el PR de reformato). Ultimas lineas del log abajo."
          tail -30 "$RUNNER_TEMP/fmt.log"
          exit 0

      # NEGATIVO, Y QUE MIRE EL NOMBRE Y NO EL CODIGO DE SALIDA. Con la deuda
      # actual el hook VERIFY_ONLY sale con 1 aunque el fichero malo no
      # exista, asi que esperar "!= 0" probaria nada. Lo que prueba es que el
      # NOMBRE del fichero aparece en la salida del hook.
      - name: Hook catches unformatted code (negative test)
        shell: bash
        run: |
          printf 'int main(){return 0;}\n' > .hook_test_bad.cpp
          git add .hook_test_bad.cpp
          set +e
          VERIFY_ONLY=1 bash .githooks/pre-commit > "$RUNNER_TEMP/neg.log" 2>&1
          set -e
          git reset -q .hook_test_bad.cpp
          rm -f .hook_test_bad.cpp
          if ! grep -q 'hook_test_bad.cpp' "$RUNNER_TEMP/neg.log"; then
            echo "::error::el hook no ha nombrado el archivo mal formateado .hook_test_bad.cpp en su salida. VERIFY_ONLY puede estar roto."
            head -30 "$RUNNER_TEMP/neg.log"
            exit 1
          fi
          echo "El hook detecto y nombro el archivo mal formateado."
